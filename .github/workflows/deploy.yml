# Сборка и публикация на GitHub Pages при каждом изменении в ветке main
name: Публикация на GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: Wait for the uploaded site package
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        with:
          script: |
            for (let attempt = 0; attempt < 30; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId,
              });
              if (data.artifacts.some(artifact => artifact.name === process.env.PAGES_ARTIFACT && !artifact.expired)) return;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            core.setFailed('The uploaded site package is not visible yet. Retry this deployment.');
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
