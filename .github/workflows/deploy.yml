# Сборка и публикация на GitHub Pages при каждом изменении в ветке main
name: Публикация на GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - id: site-package
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - id: deployment
        name: Publish the uploaded site package
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
          PAGES_ARTIFACT_ID: ${{ steps.site-package.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('Missing site package ID.');
            let visible = false;
            for (let attempt = 0; attempt < 30; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId,
              });
              if (data.artifacts.some(artifact => artifact.id === artifactId && artifact.name === process.env.PAGES_ARTIFACT && !artifact.expired)) {
                visible = true;
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            if (!visible) throw new Error('The uploaded site package is not visible yet.');
            const oidcToken = await core.getIDToken();
            core.setSecret(oidcToken);
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: artifactId, pages_build_version: context.sha, oidc_token: oidcToken,
            });
            const deploymentId = String(deployment.id || deployment.status_url?.split('/').pop() || context.sha);
            core.setOutput('page_url', deployment.page_url);
            const finalErrors = new Set(['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            let errors = 0;
            for (let attempt = 0; attempt < 120; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              try {
                const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                  ...context.repo, deployment_id: deploymentId,
                });
                if (data.status === 'succeed') {
                  core.info('Site publication succeeded.');
                  return;
                }
                if (finalErrors.has(data.status)) throw new Error('Site publication failed: ' + data.status);
                core.info('Site publication: ' + data.status);
                errors = 0;
              } catch (error) {
                if (!error.status || ![404, 429, 500, 502, 503, 504].includes(error.status) || ++errors >= 10) throw error;
                core.warning('Waiting for the publication status to become available.');
              }
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
              ...context.repo, deployment_id: deploymentId,
            });
            throw new Error('Site publication timed out.');
